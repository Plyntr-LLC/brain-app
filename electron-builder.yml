appId: com.plyntr.brain
productName: Brain
copyright: Copyright © Plyntr LLC
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
extraResources:
  - from: vendor/brain-sync
    to: hq-sync
  - from: src/main/phone-fonts
    to: phone-fonts
  - from: src/main/desk/gmail-send.cjs
    to: desk/gmail-send.cjs
  - from: src/main/desk/imessage.cjs
    to: desk/imessage.cjs
  - from: src/main/browser-mcp.cjs
    to: browser-mcp.cjs
  - from: src/main/open-guard.cjs
    to: open-guard.cjs
  - from: src/preload/page-guard.cjs
    to: page-guard.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: Brain-${version}-mac.${ext}
  hardenedRuntime: true
  minimumSystemVersion: "13.0"
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.inherit.plist
  # The provisioning profile (Touch ID passkeys) is passed by scripts/pack-mac.cjs only when it signs with Developer ID.
  extendInfo:
    NSCameraUsageDescription: A web page in Brain's browser asked to use your camera.
    NSMicrophoneUsageDescription: A web page in Brain's browser asked to use your microphone.
  notarize: false
dmg:
  title: Brain
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Brain-${version}-win.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Brain
publish:
  provider: github
  owner: Plyntr-LLC
  repo: brain-app
