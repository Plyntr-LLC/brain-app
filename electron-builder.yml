appId: com.plyntr.brain
productName: Brain
copyright: Copyright © Plyntr LLC
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: Brain-${version}-mac.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  title: Brain
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Brain-${version}-win.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Brain
publish:
  provider: github
  owner: Plyntr-LLC
  repo: brain-app
